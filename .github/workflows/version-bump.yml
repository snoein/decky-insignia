name: Version Bump

# Manually triggered release: bumps package.json's version (major/minor/patch),
# lands the commit on main via an auto-merged PR (the main branch ruleset
# requires all changes go through a pull request, with no exceptions for
# GitHub Actions), tags the resulting merge commit, and publishes a draft
# GitHub Release with generated notes. The build-zip job then calls
# build-release.yml (as a reusable workflow) to build the plugin zip, attach
# it, and publish the release. Always operates on `main`, regardless of which
# branch is selected in the "Run workflow" dispatch UI.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: version-bump
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    outputs:
      tag: v${{ steps.bump.outputs.version }}
    steps:
      - name: Require dispatch from main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::This workflow only runs against main (selected: ${{ github.ref_name }})." >&2
          exit 1

      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      # Version comes from package.json's packageManager/engines.node fields
      # (single source of truth) rather than being pinned here.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump version
        id: bump
        run: |
          # --no-git-tag-version: only edit package.json here. The commit goes
          # on a release branch (main can't be pushed to directly), and the
          # tag gets created afterwards, on the actual post-merge commit.
          pnpm version ${{ inputs.bump }} --no-git-tag-version
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Open and merge release PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="release/v${{ steps.bump.outputs.version }}"
          git checkout -b "$branch"
          git commit -am "chore: release v${{ steps.bump.outputs.version }}"
          git push origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "chore: release v${{ steps.bump.outputs.version }}" \
            --body "Automated version bump."
          gh pr merge "$branch" --squash --delete-branch

      - name: Tag merged commit
        run: |
          git fetch origin main
          git tag "v${{ steps.bump.outputs.version }}" origin/main
          git push origin "v${{ steps.bump.outputs.version }}"

      # Created as a draft so it's invisible on the public Releases page
      # until build-zip attaches the zip and publishes it. If build-zip
      # fails, this draft is the only visible leftover state (not public),
      # and re-running the failed job will finish publishing it.
      - name: Create draft GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.bump.outputs.version }}
          name: v${{ steps.bump.outputs.version }}
          generate_release_notes: true
          draft: true

  build-zip:
    needs: bump
    permissions:
      contents: write
    uses: ./.github/workflows/build-release.yml
    with:
      tag: ${{ needs.bump.outputs.tag }}
